<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 전광판 - Voting</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 30px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1e293b;
      padding-bottom: 20px;
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 14px;
      word-break: break-all;
    }
    .badge {
      background: #22c55e;
      color: #fff;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .badge.closed {
      background: #ef4444;
    }
    .live-dot {
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    @keyframes blink { 50% { opacity: 0.3; } }
    .total-count {
      font-size: 1.5rem;
      font-weight: 700;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .total-count b {
      color: #6366f1;
      font-size: 2.2rem;
    }
    
    .board-container {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 32px;
      flex: 1;
    }
    @media (max-width: 860px) {
      .board-container {
        grid-template-columns: 1fr;
      }
    }
    
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .rank-item {
      background: #1e293b;
      border-radius: 16px;
      padding: 18px 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid #334155;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .rank-item.leader {
      border: 2px solid #eab308;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.25);
    }
    .progress-bg {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.35;
      z-index: 0;
    }
    .rank-content {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .item-title {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 14px;
      word-break: break-all;
    }
    .item-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .item-stats {
      text-align: right;
      white-space: nowrap;
    }
    .item-votes {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .item-percent {
      font-size: 1.15rem;
      color: #94a3b8;
      font-weight: 600;
    }
    
    .qr-panel {
      background: #1e293b;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid #334155;
      align-self: start;
    }
    .qr-box {
      background: #fff;
      padding: 14px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box canvas {
      width: 220px;
      height: 220px;
      image-rendering: pixelated;
      display: block;
    }
    .qr-text {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #e2e8f0;
    }
    .qr-sub {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
      font-size: 1.3rem;
      background: #1e293b;
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1 id="boardTitle">투표 불러오는 중... <span class="badge" id="liveBadge"><span class="live-dot"></span>LIVE</span></h1>
    </div>
    <div class="total-count">
      현재 투표 참여: <b id="totalCount">0</b>명
    </div>
  </div>

  <div class="board-container">
    <div class="rank-list" id="rankList">
      <div class="empty-state">아직 투표 항목이 없습니다.</div>
    </div>

    <div class="qr-panel">
      <div class="qr-box" id="qrBox"></div>
      <div class="qr-text">카메라로 비추면 바로 투표!</div>
      <div class="qr-sub">별도 앱 설치 없이 스마트폰 기본 카메라로 비추면 즉시 참여할 수 있습니다.</div>
    </div>
  </div>

  <script>
    // 관리자 로그인 토큰 확인 (관리자 페이지에 로그인한 적이 없으면 차단)
    const adminPw = sessionStorage.getItem('voting_admin_pw');
    if (!adminPw) {
      document.body.innerHTML = `
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:80vh; text-align:center;">
          <h2 style="font-size:2rem; margin-bottom:12px; color:#ef4444;">🔒 관리자 전용 화면입니다</h2>
          <p style="color:#94a3b8; font-size:1.1rem; margin-bottom:24px;">전광판 화면은 관리자 로그인이 필요합니다.</p>
          <a href="/admin" style="background:#4f46e5; color:#fff; padding:12px 24px; border-radius:10px; text-decoration:none; font-weight:700;">관리자 로그인하러 가기</a>
        </div>
      `;
    }

    const COLORS = ['#ef4444', '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16', '#0ea5e9', '#e11d48'];
    let current = null;

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function makeQrCanvas(text, scale) {
      if (typeof qrcode === 'undefined') return null;
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount();
      const margin = 3;
      const size = (n + margin * 2) * scale;
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#000';
      for (let r = 0; r < n; r++) {
        for (let col = 0; col < n; col++) {
          if (qr.isDark(r, col)) ctx.fillRect((col + margin) * scale, (r + margin) * scale, scale, scale);
        }
      }
      return c;
    }

    // QR 생성
    function initQR() {
      const voteUrl = window.location.origin + '/';
      const canvas = makeQrCanvas(voteUrl, 8);
      const box = document.getElementById('qrBox');
      if (canvas && box) {
        box.innerHTML = '';
        box.appendChild(canvas);
      }
    }

    function render(s) {
      if (!s) return;
      document.title = (s.title || 'Voting') + ' - 실시간 전광판';
      const closed = s.status === 'closed';
      
      const badge = document.getElementById('liveBadge');
      if (closed) {
        badge.className = 'badge closed';
        badge.innerHTML = '투표 종료';
      } else {
        badge.className = 'badge';
        badge.innerHTML = '<span class="live-dot"></span>LIVE';
      }
      
      document.getElementById('boardTitle').childNodes[0].textContent = (s.title || 'Voting') + ' ';
      
      const total = s.total || s.participants || 0;
      document.getElementById('totalCount').innerText = total;

      const listEl = document.getElementById('rankList');
      if (!s.options || s.options.length === 0) {
        listEl.innerHTML = '<div class="empty-state">아직 투표 항목이 없습니다.</div>';
        return;
      }

      const results = s.results || {};
      const maxVotes = Math.max(0, ...Object.values(results));

      listEl.innerHTML = s.options
        .map((o, idx) => {
          const c = results[o.id] || 0;
          const pct = total ? Math.round((c / total) * 100) : 0;
          const barWidth = c > 0 ? Math.max(pct, 4) : 0;
          const isLeader = c > 0 && c === maxVotes;
          const color = COLORS[idx % COLORS.length];

          return `
            <div class="rank-item ${isLeader ? 'leader' : ''}">
              <div class="progress-bg" style="width: ${barWidth}%; background: ${color};"></div>
              <div class="rank-content">
                <div class="item-title">
                  <span class="item-badge" style="background:${color}; color:#fff;">${idx + 1}</span>
                  <span>${esc(o.text)} ${isLeader ? '👑' : ''}</span>
                </div>
                <div class="item-stats">
                  <span class="item-votes" style="color: ${color};">${c}표</span>
                  <span class="item-percent">(${pct}%)</span>
                </div>
              </div>
            </div>
          `;
        })
        .join('');
    }

    // 초기 상태 불러오기
    fetch('/api/state')
      .then(r => r.json())
      .then(d => {
        current = d;
        render(d);
        initQR();
      });

    // 실시간 SSE 스트림 수신
    const es = new EventSource('/api/events' + (adminPw ? '?pw=' + encodeURIComponent(adminPw) : ''));
    es.onmessage = (e) => {
      try {
        current = JSON.parse(e.data);
        render(current);
      } catch (err) {}
    };
  </script>
</body>
</html>
